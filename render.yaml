services:
  - type: web
    name: bcna-fmp-mcp
    runtime: python
    plan: free
    autoDeployTrigger: commit
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn asgi:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: FMP_API_KEY
        sync: false
      - key: FMP_MCP_ACCESS_TOKEN
        sync: false
