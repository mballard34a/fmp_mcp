services:
  - type: web
    name: bcna-fmp-mcp
    runtime: python
    plan: free
    autoDeployTrigger: commit
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn asgi:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: FMP_API_KEY
        sync: false
      - key: FMP_MCP_ACCESS_TOKEN
        sync: false
      - key: FMP_MCP_AUTH_MODE
        value: mixed
      - key: MCP_PUBLIC_BASE_URL
        value: https://bcna-fmp-mcp.onrender.com
      - key: OAUTH_ISSUER
        sync: false
      - key: OAUTH_AUDIENCE
        value: https://bcna-fmp-mcp.onrender.com
      - key: OAUTH_REQUIRED_SCOPES
        value: fmp:read
      - key: OAUTH_ALGORITHMS
        value: RS256
